name: Check reference implementation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m assurance run --as-of 2026-09-30T12:00:00Z
      - run: PYTHONPATH=src python -m assurance verify artifacts/demo
      - run: python scripts/build_site.py
      - run: python scripts/check_site.py site
