<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" role="img" aria-labelledby="t d"><title id="t">Phased delivery roadmap</title><desc id="d">Eight phases progress from charter, inventory, control design and platform foundations through automation, process evidence, audit readiness and ongoing operation.</desc><rect width="1100" height="330" rx="18" fill="#132235"/><path d="M90 105H1010M90 240H1010" stroke="#517466" stroke-width="3"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#79dfb7"><circle cx="125" cy="105" r="27"/><circle cx="405" cy="105" r="27"/><circle cx="685" cy="105" r="27"/><circle cx="965" cy="105" r="27"/><circle cx="125" cy="240" r="27"/><circle cx="405" cy="240" r="27"/><circle cx="685" cy="240" r="27"/><circle cx="965" cy="240" r="27"/></g><g fill="#153729" font-size="20" font-weight="700"><text x="125" y="112">0</text><text x="405" y="112">1</text><text x="685" y="112">2</text><text x="965" y="112">3</text><text x="125" y="247">4</text><text x="405" y="247">5</text><text x="685" y="247">6</text><text x="965" y="247">7</text></g><g fill="#e5f2f8" font-size="18"><text x="125" y="55">Charter + authority</text><text x="405" y="55">Inventory + classify</text><text x="685" y="55">Control design</text><text x="965" y="55">Secure foundations</text><text x="125" y="190">Automate a slice</text><text x="405" y="190">Process evidence</text><text x="685" y="190">Remediate + audit</text><text x="965" y="190">Operate + improve</text></g><g fill="#adc4d6" font-size="14"><text x="125" y="153">Approved scope</text><text x="405" y="153">Trusted denominator</text><text x="685" y="153">Testable objectives</text><text x="965" y="153">Protected evidence</text><text x="125" y="288">Known failures detected</text><text x="405" y="288">Operation demonstrated</text><text x="685" y="288">Reviewed decisions</text><text x="965" y="288">Sustained quality</text></g></g></svg>
