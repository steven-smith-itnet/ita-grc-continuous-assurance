<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">Continuous assurance evidence architecture</title><desc id="desc">AWS, Azure, GCP and business systems feed scoped collectors, regional evidence storage and versioned tests. Scope and classification determine applicability. Findings move through review and remediation to an assurance report.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#498274"/></marker></defs><rect width="1100" height="420" rx="18" fill="#edf5f1"/><g fill="#fff" stroke="#bfd5cc" stroke-width="2"><rect x="30" y="150" width="165" height="150" rx="12"/><rect x="235" y="170" width="165" height="105" rx="12"/><rect x="445" y="170" width="175" height="105" rx="12"/><rect x="665" y="170" width="165" height="105" rx="12"/><rect x="870" y="150" width="200" height="150" rx="12"/><rect x="420" y="30" width="435" height="85" rx="12"/><rect x="270" y="335" width="580" height="55" rx="10"/></g><g stroke="#498274" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M195 222H232"/><path d="M400 222H442"/><path d="M620 222H662"/><path d="M830 222H867"/><path d="M746 115V166"/><path d="M970 302V362H854"/><path d="M268 362H112V304"/></g><g font-family="system-ui,sans-serif" fill="#173b33" font-size="18" text-anchor="middle"><text x="112" y="186" font-weight="700">Source systems</text><text x="112" y="221">AWS · Azure · GCP</text><text x="112" y="251">IdP · CI · ITSM</text><text x="317" y="209" font-weight="700">Read-only</text><text x="317" y="240">collectors</text><text x="532" y="209" font-weight="700">Regional vault</text><text x="532" y="240">raw + normalized</text><text x="747" y="209" font-weight="700">Versioned tests</text><text x="747" y="240">PASS / FAIL / ?</text><text x="970" y="189" font-weight="700">Review + report</text><text x="970" y="222">Findings · decisions</text><text x="970" y="253">Evidence references</text><text x="637" y="63" font-weight="700">Scope · classification · requirements</text><text x="637" y="93">Governed inputs determine applicability</text><text x="560" y="369">Owner → corrective action → independent retest</text></g></svg>
